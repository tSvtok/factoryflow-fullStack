services:
  mongo:
    image: mongo:7
    container_name: factoryflow-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first run
      test: >
        echo "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
        | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    container_name: factoryflow-backend
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/factoryflow?replicaSet=rs0
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app            # live code reload
      - /app/node_modules         # keep container's node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: factoryflow-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
